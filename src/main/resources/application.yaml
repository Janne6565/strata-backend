spring:
  application:
    name: strata-backend
  datasource:
    url: ${STRATA_DB_URL:jdbc:postgresql://localhost:5432/strata}
    username: ${STRATA_DB_USERNAME:strata}
    password: ${STRATA_DB_PASSWORD:strata}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates against it.
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true

# Strata application config (bound via @ConfigurationProperties).
strata:
  auth:
    # First-owner bootstrap. DEV defaults — override via STRATA_OWNER_* and change after first login.
    # Only used when no OWNER exists yet.
    bootstrap:
      username: ${STRATA_OWNER_USERNAME:owner}
      password: ${STRATA_OWNER_PASSWORD:change-me-now}
    # Secure flag on the refresh cookie. True everywhere real; set false only for plain-HTTP local dev.
    cookie-secure: ${STRATA_COOKIE_SECURE:true}
  jwt:
    # DEV ONLY — must be overridden via STRATA_JWT_SECRET in every real environment.
    secret: ${STRATA_JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
    access-token-ttl: PT1H
    refresh-token-ttl: P30D
    issuer: strata
  frontend:
    # Where OAuth callbacks redirect the browser after login (success -> /, failure -> /login?oauthError=...).
    url: ${STRATA_FRONTEND_URL:http://localhost:5173}
  oauth:
    # Federated OIDC login (Authentik). client-id/secret injected via env in real deployments.
    providers:
      authentik:
        client-id: ${STRATA_OAUTH_CLIENT_ID:}
        client-secret: ${STRATA_OAUTH_CLIENT_SECRET:}
        authorization-uri: https://sso.jannekeipert.de/application/o/authorize/
        token-uri: https://sso.jannekeipert.de/application/o/token/
        user-info-uri: https://sso.jannekeipert.de/application/o/userinfo/
        scope: "openid email profile"
        callback-uri: ${STRATA_OAUTH_CALLBACK_URI:http://localhost:8080/api/v1/auth/oauth/authentik/callback}
    # Authentik groups that gate access and map to the coarse role.
    groups:
      admin: strata-admins
      user: strata-users
  kubernetes:
    namespace-scope: ALL
    prod-namespace-patterns:
      - "*prod*"
    read-only-safe-mode: true
  discovery:
    # Image -> driver detectors (see ARCHITECTURE.md §8). Populated per environment.
    detectors: []
    # Periodic cluster re-scan on top of the manual /rescan endpoint. Cron is a 6-field
    # Spring expression; default is hourly on the hour.
    auto-scan:
      enabled: ${STRATA_DISCOVERY_AUTO_SCAN_ENABLED:true}
      cron: ${STRATA_DISCOVERY_AUTO_SCAN_CRON:0 0 * * * *}
  backup:
    # Scheduled pg_dump of the state database. Off locally; enabled in k8s via ConfigMap.
    enabled: ${STRATA_BACKUP_ENABLED:false}
    directory: ${STRATA_BACKUP_DIR:./backups}
    cron: ${STRATA_BACKUP_CRON:0 0 */2 * * *}
    # Tier boundaries: the oldest backup in each age bucket is kept, older than the last is pruned.
    retention-tiers: [2h, 1d, 3d, 7d, 14d, 30d, 60d]
    pg-dump-path: ${STRATA_PG_DUMP_PATH:pg_dump}
    timeout: 5m

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Actuator: expose health (with k8s liveness/readiness probe groups) and the Prometheus scrape
# endpoint over HTTP; other endpoints stay off the web surface. Health details are hidden from
# anonymous callers. Both stay on the app port: the public Ingress only routes /api to the
# backend, so /actuator is reachable from inside the cluster only.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  # Metrics are scraped by Grafana Alloy into Grafana Cloud, whose free tier (10,000 active
  # series) the whole cluster shares; this service's budget is <= 200 series. Every label
  # combination is a series, so the settings below are deliberately lean (MetricsConfig also
  # keeps the actuator's own probe/scrape traffic out of http.server.requests).
  metrics:
    tags:
      # Stamp every meter with the app name so the shared backend can tell services apart.
      application: ${spring.application.name}
    distribution:
      # Client-side percentiles, NOT a bucket histogram: Alloy drops every *_bucket series
      # anyway, and a histogram ships one series per bucket per URI per status. Strata has
      # ~35 routes, so only p95/p99 are kept (no p50) to stay under the budget.
      #
      # Trade-off: these are computed inside this JVM, so they cannot be re-aggregated across
      # replicas and a quantile not listed here cannot be recovered later. Fine at the single
      # replica this runs (see the deployment); revisit before scaling out.
      percentiles-histogram:
        http.server.requests: false
      percentiles:
        http.server.requests: 0.95, 0.99
    # Meter families nobody reads, cut for the series budget. Kept: http.server.requests,
    # jvm.memory, jvm.gc, jvm.threads, process/system cpu, process.uptime, hikaricp,
    # jdbc.connections, logback.events, disk.
    enable:
      spring.security: false
      spring.data.repository: false
      tomcat.sessions: false
      jvm.buffer: false
      jvm.classes: false
      jvm.compilation: false
      executor: false
      tasks.scheduled: false
      application.started.time: false
      application.ready.time: false
      http.server.requests.active: false
      process.files: false
